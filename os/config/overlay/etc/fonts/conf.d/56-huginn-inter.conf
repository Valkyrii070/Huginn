<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Huginn OS: Inter, its typeface, comes as the variable font ("Inter Variable", fonts-inter-variable). Anything that
     asks for plain "Inter" (the sign-in and lock screens, documents made in Writer, Sheets and Slides, Easel) gets it
     instead of falling back to Noto Sans. -->
<fontconfig>
  <alias binding="same">
    <family>Inter</family>
    <prefer><family>Inter Variable</family></prefer>
  </alias>
</fontconfig>
