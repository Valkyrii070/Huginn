[General]
# The realm whose live wallpaper and colours the sign-in screen wears: aurora, bifrost, muspelheim or niflheim.
realm=aurora
# Where the live wallpapers are (LiveWallpaper.qml, the scenes and their stills).
live=/usr/share/huginn-os/live/
# Seconds without a key or a movement before everything but the clock fades and the wallpaper has the screen.
idleSeconds=30
# 24-hour clock ("true") or 12-hour ("false"); empty follows the system's locale.
clock24=
font=Inter
