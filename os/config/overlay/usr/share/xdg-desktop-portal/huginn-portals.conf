# Huginn OS's desktop portal: which backend answers which question for apps.
#   huginn           Open and Save, screenshots and colour picking, "Allow …?" questions, Open With
#                    (apps/huginn_portal.py)
#   huginn-settings  dark or light, accent colour, contrast, motion, fonts (apps/huginn_portal_settings.py),
#                    with KDE's settings after it for anything Huginn has no say in
#   wlr              screen sharing and recording (PipeWire), from Huginn's compositor
#   kde              anything else
[preferred]
default=kde
org.freedesktop.impl.portal.FileChooser=huginn
org.freedesktop.impl.portal.Screenshot=huginn
org.freedesktop.impl.portal.Access=huginn
org.freedesktop.impl.portal.AppChooser=huginn
org.freedesktop.impl.portal.Settings=huginn-settings;kde
org.freedesktop.impl.portal.ScreenCast=wlr
