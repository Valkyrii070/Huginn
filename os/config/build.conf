# Huginn OS build configuration - sourced by scripts/build.sh
DISTRO_NAME="Huginn OS"
DISTRO_ID="huginn-os"
DISTRO_VERSION="0.1"
SUITE="resolute"                 # Ubuntu 26.04 LTS
ARCH="amd64"
COMPONENTS="main,restricted,universe,multiverse"

# Reproducibility: pin every apt source to one moment of the Ubuntu archive.
# Bump this deliberately (e.g. monthly) and commit the change; leave empty to track the live archive.
SNAPSHOT="20261101T000000Z"
MIRROR="http://archive.ubuntu.com/ubuntu"
SNAPSHOT_MIRROR="https://snapshot.ubuntu.com/ubuntu"

LIVE_USER="huginn"
LIVE_HOSTNAME="huginn"
SQUASHFS_COMP="zstd"             # use "lz4" for fast dev iterations
SQUASHFS_LEVEL="19"
